<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Абонентское обслуживание</title>
<script src="https://db.mp-lab.ru/grist-plugin-api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f7f7;--surf:#FFF;--surf2:#f7f7f7;--surf3:#e5e5e5;
  --brd:#DEDAD2;--brd2:#C4C0B6;
  --tx:#18170F;--tx2:#6A6860;--tx3:#9E9C94;
  --acc:#1E4ED8;--acc-bg:#EEF2FF;--acc-brd:#C7D2FE;
  --grn:#0D6E4E;--grn-bg:#ECFDF5;--grn-brd:#A7F3D0;
  --warn:#92400E;--warn-bg:#FFFBEB;--warn-brd:#FCD34D;
  --red:#991B1B;--red-bg:#FEF2F2;--red-brd:#FECACA;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
  --r:4pt;--r2:4pt;
}
html,body{height:100%;overflow:hidden;font-family:var(--sans);font-size:13px;color:var(--tx);background:var(--bg)}
.app{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0}
.conn-dot.ok{background:var(--grn)}
.conn-lbl{font-size:11px;color:var(--tx3)}
.conn-status{position:fixed;left:10px;bottom:6px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--tx3);background:var(--surf2);border:1px solid var(--brd);border-radius:4pt;padding:1px 7px;z-index:10}
.ver-footer{position:fixed;right:10px;bottom:6px;font-family:var(--mono);font-size:10px;color:var(--tx3);background:var(--surf2);border:1px solid var(--brd);border-radius:4pt;padding:1px 7px;z-index:10}

.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0}

.panel{background:var(--surf);border:1px solid var(--brd);border-radius:0;overflow:hidden}
.panel+.panel{border-top:none}
.ph{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px;border-bottom:1px solid var(--brd);background:var(--surf2);gap:8px}
.ph-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2)}
.ph-actions{display:flex;align-items:center;gap:6px}
.pb{padding:10px 12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--brd);border-radius:var(--r);background:var(--surf);color:var(--tx2);padding:5px 10px;font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--acc-brd);color:var(--acc);background:var(--acc-bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#16b378;border-color:#16b378;color:#fff}
.btn-primary:hover{opacity:.88;color:#fff;border-color:#16b378;background:#16b378}
.btn-primary:disabled{opacity:.35}
.btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}

.reg-filter-bar{padding:8px 12px;background:var(--surf2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px}
.reg-filter-wrap{position:relative;flex:1}
.reg-filter-input{width:100%;height:28px;border:1px solid var(--brd);border-radius:var(--r);padding:0 9px 0 28px;font-family:inherit;font-size:12px;background:#fff;outline:none;color:var(--tx)}
.reg-filter-input:focus{border-color:var(--acc)}
.reg-filter-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}

.reg-table{width:100%;border-collapse:collapse;font-size:12px}
.reg-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);padding:6px 8px;border-bottom:2px solid var(--brd);text-align:left;background:var(--surf2);white-space:nowrap}
.reg-table td{padding:7px 8px;border-bottom:1px solid var(--brd);vertical-align:middle;text-align:left}
.reg-table tr:last-child td{border-bottom:none}
.reg-table tr:hover td{background:var(--surf2)}
.reg-empty{padding:20px;text-align:center;color:var(--tx3);font-size:12px}

.cs-client{font-weight:600;color:var(--tx)}
.cs-subject{color:var(--tx2);font-size:11.5px;line-height:1.5}
.cs-date-cell{font-family:var(--mono);font-size:11.5px;color:var(--tx);cursor:help;border-bottom:1px dashed var(--brd2)}
.cs-date-empty{color:var(--tx3);font-style:italic;border-bottom:none;cursor:default}

.cs-years-wrap{display:flex;align-items:center;gap:6px}
.cs-years-input{width:56px;height:26px;border:1px solid var(--brd);border-radius:var(--r);padding:0 6px;font-family:var(--mono);font-size:12px;text-align:center;outline:none}
.cs-years-input:focus{border-color:var(--acc)}
.cb-box{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1.5px solid var(--brd2);border-radius:3pt;background:var(--surf3);cursor:pointer;transition:all .12s;color:transparent;flex-shrink:0}
.cb-box:hover{border-color:var(--acc-brd);background:var(--acc-bg)}
.cb-box.on{border-color:var(--grn);background:var(--grn);color:#fff}

.cs-end-cell{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--tx)}
.cs-end-empty{color:var(--tx3);font-weight:400;font-style:italic}

.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4pt}
.tag-blue{background:var(--acc-bg);color:var(--acc)}
.tag-grey{background:var(--surf3);color:var(--tx3)}
.tag-green{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-brd)}
.tag-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-brd)}

.eye-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid transparent;border-radius:4pt;background:transparent;color:var(--tx3);cursor:pointer;transition:all .1s;padding:0}
.eye-btn:hover{background:var(--surf3);color:var(--tx)}

tr.cs-row-expired td{opacity:.5}
tr.cs-row-expired .cs-client{color:var(--tx2)}
tr.cs-row-hidden td{background:var(--surf2)}

#gTooltip{position:fixed;background:var(--tx);color:#fff;padding:6px 10px;border-radius:var(--r);font-size:11px;font-weight:400;white-space:pre;z-index:9999;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);line-height:1.4}

.modal-overlay{position:fixed;inset:0;background:rgba(24,23,15,.35);display:none;align-items:center;justify-content:center;z-index:500}
.modal-overlay.on{display:flex}
.modal-box{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r2);max-width:640px;width:92%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--brd)}
.modal-title{font-size:13px;font-weight:600}
.modal-body{padding:12px 16px;overflow-y:auto;flex:1}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--brd)}
.sync-item{padding:6px 0;border-bottom:1px solid var(--surf3);font-size:12px}
.sync-item:last-child{border-bottom:none}
.sync-item b{font-weight:600}
.sync-empty{color:var(--tx3);font-size:12px;padding:8px 0}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4pt}
</style>
</head>
<body>
<div class="app">
<main class="main" id="main">

  <div class="panel">
    <div class="ph">
      <span class="ph-title">Абонентское обслуживание</span>
      <div class="ph-actions">
        <button class="btn" id="btnShowHidden" onclick="toggleShowHidden()">Показать скрытые</button>
        <button class="btn btn-primary" id="btnSync" onclick="openSyncModal()">Синхронизировать</button>
      </div>
    </div>
    <div class="reg-filter-bar">
      <div class="reg-filter-wrap">
        <svg class="reg-filter-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="reg-filter-input" id="filterInput" placeholder="Поиск по клиенту или предмету договора…" oninput="renderTable()">
      </div>
    </div>
    <div id="tableBody"></div>
  </div>

</main>
</div>

<div class="conn-status">
  <div class="conn-dot" id="connDot"></div>
  <span class="conn-lbl" id="connLbl">Ожидание Grist…</span>
</div>
<footer class="ver-footer">v0.1.0</footer>
<div id="gTooltip"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title">Синхронизация с Tu_accounting</span>
      <button class="eye-btn" onclick="closeSyncModal()">✕</button>
    </div>
    <div class="modal-body" id="syncBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeSyncModal()">Отмена</button>
      <button class="btn btn-primary" id="syncApplyBtn" onclick="applySync()">Применить</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════
   ГОСТ 2.102 — коды основных конструкторских документов
   (справочник переиспользован из widget-inventory-book)
═══════════════════════════════════ */
const DOC_TYPES = [
  { code: '', label: 'ЧД', fullName: 'Чертёж детали' },
  { code: '', label: 'СП', fullName: 'Спецификация' },
  { code: 'СБ', label: 'СБ', fullName: 'Сборочный чертёж' },
  { code: 'ПЭ3', label: 'ПЭ3', fullName: 'Перечень элементов' },
  { code: 'ГЧ', label: 'ГЧ', fullName: 'Габаритный чертёж' },
  { code: 'ЛУ', label: 'ЛУ', fullName: 'Лист утверждения' },
  { code: 'Э1', label: 'Э1', fullName: 'Схема электрическая структурная' },
  { code: 'Э2', label: 'Э2', fullName: 'Схема функциональная' },
  { code: 'Э3', label: 'Э3', fullName: 'Схема электрическая принципиальная' },
  { code: 'Э4', label: 'Э4', fullName: 'Схема соединений' },
  { code: 'Э5', label: 'Э5', fullName: 'Схема подключения' },
  { code: 'ВС', label: 'ВС', fullName: 'Ведомость спецификаций' },
  { code: 'ВП', label: 'ВП', fullName: 'Ведомость покупных изделий' },
  { code: 'ТУ', label: 'ТУ', fullName: 'Технические условия' },
  { code: 'РЭ', label: 'РЭ', fullName: 'Руководство по эксплуатации' },
  { code: 'ПС', label: 'ПС', fullName: 'Паспорт' },
  { code: 'ЭТ', label: 'ЭТ', fullName: 'Этикетка' },
  { code: 'ВЭ', label: 'ВЭ', fullName: 'Ведомость эксплуатационных документов' },
  { code: 'ВДЭ', label: 'ВДЭ', fullName: 'Ведомость электронных документов' },
  { code: 'УД', label: 'УД', fullName: 'Удостоверяющий лист' },
  { code: 'Е1', label: 'Е1', fullName: 'Схема деления структурная' },
  { code: 'РР1', label: 'РР1', fullName: 'Расчёт надёжности' },
  { code: 'РР2', label: 'РР2', fullName: 'Расчёт содержания драгоценных материалов' },
  { code: 'РР3', label: 'РР3', fullName: 'Расчёт показателей уровня стандартизации и унификации' },
  { code: 'Д', label: 'Д', fullName: 'Данные конструкции' },
  { code: 'Д1', label: 'Д1', fullName: 'Ведомость документов' },
  { code: 'Д2', label: 'Д2', fullName: 'Протокол информационного взаимодействия по CAN-интерфейсу' },
  { code: 'Д3', label: 'Д3', fullName: 'Справочный чертёж' },
  { code: 'Д4', label: 'Д4', fullName: 'Комплект карт для оценки правильности применения электрорадиоизделий' },
  { code: 'ИС', label: 'ИС', fullName: 'Инструкция по эксплуатации' },
];
// коды документов, отсортированные по убыванию длины — чтобы «РР1» не проглатывалось как «Р»
const DOC_CODES_BY_LEN = DOC_TYPES.map(d => d.code).filter(Boolean)
  .filter((v, i, a) => a.indexOf(v) === i)
  .sort((a, b) => b.length - a.length);

const CS_TABLE = 'Customer_subscription';
const SRC_TABLE = 'Tu_accounting';
const DEFAULT_OPTIONS = { hiddenKeys: {} };

const S = {
  records: [],        // строки Customer_subscription (текущий вид)
  sourceRows: [],      // строки Tu_accounting
  options: { ...DEFAULT_OPTIONS },
  hiddenKeys: {},       // shipment_contract -> true
  showHidden: false,
  syncPlan: null,
};

let firstLoadDone = false;

/* ═══════════════════════════════════
   ПАРСИНГ ТЕКСТА ИЗ Tu_accounting
═══════════════════════════════════ */

// "ГКВ-1 ОЕМ ЛМАП.402131.046ТУ" -> {product:"ГКВ-1 ОЕМ", designation:"ЛМАП.402131.046", docCode:"ТУ", docLabel:"ТУ (Технические условия)"}
function parseDocText(raw) {
  const s = String(raw || '').trim();
  if (!s) return null;
  const m = s.match(/^(.*?)([A-ZА-ЯЁ]{2,6}\.\d{5,6}\.\d{3}(?:-\d{1,3})?)([A-ZА-ЯЁ0-9]*)$/);
  if (!m) {
    // децимальный номер не распознан — возвращаем текст как есть
    return { product: s, designation: '', docCode: '', docLabel: '' };
  }
  const product = m[1].trim();
  const designation = m[2];
  let suffix = m[3].trim();
  let docCode = '', rest = suffix;
  // ищем самый длинный известный код документа в конце суффикса
  for (const code of DOC_CODES_BY_LEN) {
    if (suffix === code) { docCode = code; rest = ''; break; }
  }
  const found = DOC_TYPES.find(d => d.code === docCode);
  const docLabel = docCode
    ? (found ? `${docCode} (${found.fullName})` : docCode)
    : (suffix ? suffix : 'осн. документ');
  return { product, designation, docCode, docLabel };
}

// извлекает первую дату вида ДД.ММ.ГГГГ из произвольного текста
function extractRuDate(text) {
  const m = String(text || '').match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if (!m) return null;
  const dd = +m[1], mm = +m[2], yyyy = +m[3];
  const d = new Date(Date.UTC(yyyy, mm - 1, dd));
  if (isNaN(d.getTime()) || d.getUTCDate() !== dd) return null;
  return d;
}

function jsDateToGrist(d) { return d ? Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 1000) : null; }
function gristToJsDate(v) { return (v === null || v === undefined) ? null : new Date(v * 1000); }
function fmtDate(v) {
  const d = typeof v === 'number' ? gristToJsDate(v) : v;
  if (!d) return null;
  return `${String(d.getUTCDate()).padStart(2, '0')}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${d.getUTCFullYear()}`;
}

/* ═══════════════════════════════════
   ГРУППИРОВКА Tu_accounting -> строки подписки
   ключ группы = договор отгрузки (order_text): новый договор той же
   фирмы с другой документацией всегда даёт отдельную строку.
═══════════════════════════════════ */
function computeGroupsFromSource(rows) {
  const groups = new Map();
  rows.forEach(r => {
    const key = String(r.order_text || '').trim();
    if (!key) return;
    if (!groups.has(key)) {
      groups.set(key, { key, client: '', mainDoc: '', invoiceDateText: '', advanceText: '', docs: [] });
    }
    const g = groups.get(key);
    if (!g.client && r.client_text) g.client = String(r.client_text).trim();
    if (!g.mainDoc && r.main_doc_text) g.mainDoc = String(r.main_doc_text).trim();
    if (!g.invoiceDateText && r.invoice_date_text) g.invoiceDateText = String(r.invoice_date_text).trim();
    if (!g.advanceText && r.advance_payment_text) g.advanceText = String(r.advance_payment_text).trim();
    const docKey = String(r.doc_text || r.order_description_text || '').trim();
    if (docKey && !g.docs.includes(docKey)) g.docs.push(docKey);
  });
  return Array.from(groups.values())
    .filter(g => g.client)
    .map(g => {
      const parsed = g.docs.map(parseDocText).filter(Boolean);
      const subject = parsed.length
        ? parsed.map(p => p.docCode || p.docLabel ? `${p.product} — ${p.docLabel}` : p.product).join('; ')
        : '';
      return {
        shipment_contract: g.key,
        client: g.client,
        main_doc: g.mainDoc,
        invoice_date: extractRuDate(g.invoiceDateText),
        advance_date: extractRuDate(g.advanceText),
        subject,
      };
    });
}

/* ═══════════════════════════════════
   ПЛАН СИНХРОНИЗАЦИИ (create/update) — только служебные поля,
   service_years/service_confirmed никогда не трогаем автосинком.
═══════════════════════════════════ */
function computeSyncPlan() {
  const groups = computeGroupsFromSource(S.sourceRows);
  const byKey = new Map(S.records.map(r => [String(r.shipment_contract || '').trim(), r]));
  const creates = [], updates = [];
  groups.forEach(g => {
    const fields = {
      client: g.client,
      subject: g.subject,
      shipment_contract: g.shipment_contract,
      main_doc: g.main_doc,
      invoice_date: jsDateToGrist(g.invoice_date),
      advance_date: jsDateToGrist(g.advance_date),
    };
    const existing = byKey.get(g.shipment_contract);
    if (!existing) {
      creates.push({ fields, group: g });
    } else {
      const changed = {};
      ['client', 'subject', 'main_doc'].forEach(k => {
        if (String(existing[k] || '') !== String(fields[k] || '')) changed[k] = fields[k];
      });
      if ((existing.invoice_date || null) !== fields.invoice_date) changed.invoice_date = fields.invoice_date;
      if ((existing.advance_date || null) !== fields.advance_date) changed.advance_date = fields.advance_date;
      if (Object.keys(changed).length) updates.push({ id: existing.id, fields: changed, group: g });
    }
  });
  return { creates, updates };
}

function openSyncModal() {
  S.syncPlan = computeSyncPlan();
  const body = document.getElementById('syncBody');
  const { creates, updates } = S.syncPlan;
  if (!creates.length && !updates.length) {
    body.innerHTML = '<div class="sync-empty">Изменений нет — таблица уже соответствует Tu_accounting.</div>';
  } else {
    let html = '';
    if (creates.length) {
      html += `<div class="sync-item"><b>Новые строки (${creates.length}):</b></div>`;
      html += creates.map(c => `<div class="sync-item">${esc(c.group.client)} — ${esc(c.group.shipment_contract)} <span style="color:var(--tx3)">(${esc(c.group.subject || 'без документов')})</span></div>`).join('');
    }
    if (updates.length) {
      html += `<div class="sync-item"><b>Обновятся (${updates.length}):</b></div>`;
      html += updates.map(u => `<div class="sync-item">${esc(u.group.client)} — ${esc(u.group.shipment_contract)}: ${esc(Object.keys(u.fields).join(', '))}</div>`).join('');
    }
    body.innerHTML = html;
  }
  document.getElementById('syncApplyBtn').disabled = !(creates.length || updates.length);
  document.getElementById('syncModal').classList.add('on');
}

function closeSyncModal() {
  document.getElementById('syncModal').classList.remove('on');
  S.syncPlan = null;
}

async function applySync() {
  if (!S.syncPlan) return;
  const btn = document.getElementById('syncApplyBtn');
  btn.disabled = true;
  btn.textContent = 'Применение…';
  try {
    for (const c of S.syncPlan.creates) await grist.selectedTable.create({ fields: c.fields });
    for (const u of S.syncPlan.updates) await grist.selectedTable.update({ id: u.id, fields: u.fields });
    closeSyncModal();
    await loadRecords();
  } catch (e) {
    console.error('Ошибка синхронизации:', e);
    alert('Не удалось применить синхронизацию: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Применить';
  }
}

/* ═══════════════════════════════════
   GRIST
═══════════════════════════════════ */
function initGrist() {
  if (typeof grist === 'undefined') {
    setConn(false, 'Grist API не найден');
    renderTable();
    return;
  }
  grist.ready({ requiredAccess: 'full' });
  setConn(true, 'Загрузка…');
  grist.onOptions((options) => {
    S.options = Object.assign({}, DEFAULT_OPTIONS, options || {});
    S.hiddenKeys = S.options.hiddenKeys || {};
    renderTable();
  });
  grist.onRecords(() => { if (firstLoadDone) loadRecords(); });

  Promise.all([loadRecords(), loadSource()]).then(() => { firstLoadDone = true; });
}

async function loadRecords() {
  if (typeof grist === 'undefined') return;
  try {
    const rows = await grist.docApi.fetchTable(CS_TABLE);
    S.records = rowsToRecords(rows);
    setConn(true, `${S.records.length} строк подписки`);
    renderTable();
  } catch (e) {
    console.error(`Ошибка загрузки ${CS_TABLE}:`, e);
    setConn(false, `Таблица ${CS_TABLE} не найдена`);
  }
}

async function loadSource() {
  if (typeof grist === 'undefined') return;
  try {
    const rows = await grist.docApi.fetchTable(SRC_TABLE);
    S.sourceRows = rowsToRecords(rows);
  } catch (e) {
    console.warn(`${SRC_TABLE} недоступна:`, e.message);
    S.sourceRows = [];
  }
}

function rowsToRecords(rows) {
  if (!rows || !rows.id) return [];
  return rows.id.map((id, i) => {
    const rec = { id };
    Object.keys(rows).forEach(k => { if (k !== 'id') rec[k] = rows[k][i]; });
    return rec;
  });
}

function setConn(ok, lbl) {
  document.getElementById('connDot').className = 'conn-dot' + (ok ? ' ok' : '');
  document.getElementById('connLbl').textContent = lbl;
}

/* ═══════════════════════════════════
   HIDE / SHOW (состояние — в опциях виджета, как в notification_numbers)
═══════════════════════════════════ */
function isHidden(key) { return !!S.hiddenKeys[String(key)]; }
function setHidden(key, hidden) {
  const k = String(key);
  if (hidden) S.hiddenKeys[k] = true; else delete S.hiddenKeys[k];
  grist.setOption('hiddenKeys', S.hiddenKeys);
  renderTable();
}
function toggleShowHidden() {
  S.showHidden = !S.showHidden;
  document.getElementById('btnShowHidden').classList.toggle('on', S.showHidden);
  document.getElementById('btnShowHidden').textContent = S.showHidden ? 'Скрыть скрытые' : 'Показать скрытые';
  renderTable();
}

/* ═══════════════════════════════════
   РЕДАКТИРОВАНИЕ: время обслуживания + подтверждение
═══════════════════════════════════ */
async function updateServiceYears(id, value) {
  const years = value === '' ? null : Number(value);
  if (value !== '' && (isNaN(years) || years < 0)) { renderTable(); return; }
  try {
    await grist.selectedTable.update({ id, fields: { service_years: years } });
  } catch (e) {
    console.error('Ошибка обновления срока:', e);
    alert('Не удалось сохранить срок: ' + e.message);
  }
}

async function toggleConfirmed(id, current) {
  try {
    await grist.selectedTable.update({ id, fields: { service_confirmed: !current } });
  } catch (e) {
    console.error('Ошибка подтверждения:', e);
    alert('Не удалось сохранить подтверждение: ' + e.message);
  }
}

/* ═══════════════════════════════════
   РЕНДЕР ТАБЛИЦЫ
═══════════════════════════════════ */
function renderTable() {
  const container = document.getElementById('tableBody');
  const filter = (document.getElementById('filterInput').value || '').trim().toLowerCase();
  const today = Math.floor(Date.now() / 1000);

  let rows = S.records.filter(r => r.shipment_contract);
  if (filter) {
    rows = rows.filter(r =>
      String(r.client || '').toLowerCase().includes(filter) ||
      String(r.subject || '').toLowerCase().includes(filter));
  }
  rows = rows.filter(r => S.showHidden || !isHidden(r.shipment_contract));
  rows.sort((a, b) => String(a.client || '').localeCompare(String(b.client || ''), 'ru') ||
    String(a.shipment_contract || '').localeCompare(String(b.shipment_contract || ''), 'ru'));

  if (!rows.length) {
    container.innerHTML = '<div class="reg-empty">Нет данных. Нажмите «Синхронизировать», чтобы подтянуть договоры из Tu_accounting.</div>';
    return;
  }

  const body = rows.map(r => {
    const hidden = isHidden(r.shipment_contract);
    const expired = r.service_end != null && r.service_end < today;
    const advTip = `Договор отгрузки: ${r.shipment_contract || '—'}\nДата счета: ${fmtDate(r.invoice_date) || '—'}\nГлавный документ: ${r.main_doc || '—'}`;
    const advDateStr = fmtDate(r.advance_date);
    const endDateStr = fmtDate(r.service_end);
    const rowClasses = ['', expired ? 'cs-row-expired' : '', hidden ? 'cs-row-hidden' : ''].filter(Boolean).join(' ');
    return `
    <tr class="${rowClasses}">
      <td>
        <div class="cs-client">${esc(r.client || '—')}</div>
        ${hidden ? '<span class="tag tag-grey">скрыто</span>' : ''}
      </td>
      <td class="cs-subject">${esc(r.subject || '—')}</td>
      <td>${advDateStr
        ? `<span class="cs-date-cell" data-tip="${esc(advTip)}" onmouseenter="showTooltip(this)" onmouseleave="hideTooltip()">${advDateStr}</span>`
        : '<span class="cs-date-cell cs-date-empty">не указано</span>'}
      </td>
      <td>
        <div class="cs-years-wrap">
          <input class="cs-years-input" type="number" min="0" step="0.5" value="${r.service_years != null ? esc(String(r.service_years)) : ''}"
                 onchange="updateServiceYears(${r.id}, this.value)" title="Срок обслуживания, лет">
          <span class="cb-box ${r.service_confirmed ? 'on' : ''}" onclick="toggleConfirmed(${r.id}, ${!!r.service_confirmed})" title="Подтвердить срок">${r.service_confirmed ? '✓' : ''}</span>
        </div>
      </td>
      <td>
        ${endDateStr
          ? `<span class="cs-end-cell">${endDateStr}</span> ${expired ? '<span class="tag tag-red">истёк</span>' : '<span class="tag tag-green">действует</span>'}`
          : '<span class="cs-end-cell cs-end-empty">—</span>'}
      </td>
      <td style="text-align:center">
        <button class="eye-btn" title="${hidden ? 'Показать' : 'Скрыть'}" onclick="setHidden('${esc(r.shipment_contract)}', ${!hidden})">
          ${hidden
            ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
            : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'}
        </button>
      </td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <table class="reg-table">
      <thead><tr>
        <th style="width:18%">Клиент</th>
        <th style="width:32%">Предмет договора</th>
        <th style="width:12%">Оплата аванса</th>
        <th style="width:16%">Время обслуживания</th>
        <th style="width:16%">Окончание обслуживания</th>
        <th style="width:6%"></th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

/* ═══════════════════════════════════
   ПОДСКАЗКИ / УТИЛИТЫ
═══════════════════════════════════ */
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function showTooltip(el) {
  const t = document.getElementById('gTooltip');
  const text = el.getAttribute('data-tip') || '';
  if (!text) return;
  t.textContent = text;
  t.style.display = 'block';
  const r = el.getBoundingClientRect();
  const tw = t.offsetWidth, th = t.offsetHeight;
  let top = r.top - th - 8, left = r.left + r.width / 2 - tw / 2;
  left = Math.max(4, Math.min(left, window.innerWidth - tw - 4));
  if (top < 4) top = r.bottom + 8;
  t.style.top = top + 'px';
  t.style.left = left + 'px';
}
function hideTooltip() { document.getElementById('gTooltip').style.display = 'none'; }

/* ═══════════════════════════════════
   BOOT
═══════════════════════════════════ */
renderTable();
initGrist();
</script>
</body>
</html>
