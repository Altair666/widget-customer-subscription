<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Абонентское обслуживание</title>
<script src="https://db.mp-lab.ru/grist-plugin-api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f7f7;--surf:#FFF;--surf2:#f7f7f7;--surf3:#e5e5e5;
  --brd:#DEDAD2;--brd2:#C4C0B6;
  --tx:#18170F;--tx2:#6A6860;--tx3:#9E9C94;
  --acc:#1E4ED8;--acc-bg:#EEF2FF;--acc-brd:#C7D2FE;
  --grn:#0D6E4E;--grn-bg:#ECFDF5;--grn-brd:#A7F3D0;
  --warn:#92400E;--warn-bg:#FFFBEB;--warn-brd:#FCD34D;
  --red:#991B1B;--red-bg:#FEF2F2;--red-brd:#FECACA;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
  --r:4pt;--r2:4pt;
}
html,body{height:100%;overflow:hidden;font-family:var(--sans);font-size:13px;color:var(--tx);background:var(--bg)}
.app{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0}
.conn-dot.ok{background:var(--grn)}
.conn-lbl{font-size:11px;color:var(--tx3)}
.conn-status{position:fixed;left:10px;bottom:6px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--tx3);background:var(--surf2);border:1px solid var(--brd);border-radius:4pt;padding:1px 7px;z-index:10}
.ver-footer{position:fixed;right:10px;bottom:6px;font-family:var(--mono);font-size:10px;color:var(--tx3);background:var(--surf2);border:1px solid var(--brd);border-radius:4pt;padding:1px 7px;z-index:10}

.main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:0}

.panel{background:var(--surf);border:1px solid var(--brd);border-radius:0;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.panel+.panel{border-top:none}
.ph{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px;border-bottom:1px solid var(--brd);background:var(--surf2);gap:8px}
.ph-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2)}
.ph-actions{display:flex;align-items:center;gap:6px}
.pb{padding:10px 12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--brd);border-radius:var(--r);background:var(--surf);color:var(--tx2);padding:5px 10px;font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--acc-brd);color:var(--acc);background:var(--acc-bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#16b378;border-color:#16b378;color:#fff}
.btn-primary:hover{opacity:.88;color:#fff;border-color:#16b378;background:#16b378}
.btn-primary:disabled{opacity:.35}
.btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}

.reg-filter-bar{flex-shrink:0;padding:8px 12px;background:var(--surf2);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px}
.reg-filter-wrap{position:relative;flex:1}
.reg-filter-input{width:100%;height:28px;border:1px solid var(--brd);border-radius:var(--r);padding:0 9px 0 28px;font-family:inherit;font-size:12px;background:#fff;outline:none;color:var(--tx)}
.reg-filter-input:focus{border-color:var(--acc)}
.reg-filter-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}

#tableBody{flex:1;min-height:0;overflow-y:auto}

.reg-table{width:100%;border-collapse:collapse;font-size:12px}
.reg-table th{position:sticky;top:0;z-index:2;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);padding:6px 8px;border-bottom:2px solid var(--brd);text-align:left;background:var(--surf2);white-space:nowrap}
.reg-table td{padding:7px 8px;border-bottom:1px solid var(--brd);vertical-align:middle;text-align:left}
.reg-table td[rowspan]{vertical-align:top;padding-top:9px}
.reg-table tr:last-child td{border-bottom:none}
.reg-table tr:hover td{background:var(--surf2)}
.reg-table tr.cs-client-start td{border-top:2px solid var(--brd2)}
.reg-empty{padding:20px;text-align:center;color:var(--tx3);font-size:12px}

.cs-client{font-weight:600;color:var(--tx)}
.cs-group{color:var(--tx3);font-size:11px;line-height:1.5}
.cs-doc{color:var(--tx2);font-family:var(--mono);font-size:11px;line-height:1.6}
.cs-expand-btn{margin-right:3px;vertical-align:middle}
.cs-doc-history{color:var(--tx3);font-style:italic}
.cs-date-cell{font-family:var(--mono);font-size:11.5px;color:var(--tx);cursor:help;border-bottom:1px dashed var(--brd2)}
.cs-date-empty{color:var(--tx3);font-style:italic;border-bottom:none;cursor:default}

.cell-edit-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid transparent;border-radius:4pt;background:transparent;color:var(--tx3);cursor:pointer;flex-shrink:0;transition:all .1s;padding:0}
.cell-edit-btn:hover{background:var(--acc-bg);color:var(--acc);border-color:var(--acc-brd)}
.cell-edit-btn.save{color:var(--grn)}
.cell-edit-btn.save:hover{background:var(--grn-bg);color:var(--grn);border-color:var(--grn-brd)}
.cell-edit-btn.cancel{color:var(--red)}
.cell-edit-btn.cancel:hover{background:var(--red-bg);color:var(--red);border-color:var(--red-brd)}
.cell-edit-input{width:64px;height:26px;border:1px solid var(--acc);border-radius:var(--r);padding:0 6px;font-family:inherit;font-size:12px;color:var(--tx);outline:none;background:var(--surf);text-align:center}
.cell-edit-unit{height:26px;border:1px solid var(--brd);border-radius:var(--r);padding:0 4px;font-family:inherit;font-size:11px;color:var(--tx);outline:none;background:var(--surf)}
.cell-edit-btn-wide{width:auto;padding:0 6px;font-size:10px}
.cell-edit-wrap-inline{display:flex;align-items:center;gap:4px}
.cs-years-view{display:flex;align-items:center;gap:6px}
.cs-payments{display:flex;flex-wrap:wrap;gap:4px 8px}

.cs-end-cell{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--tx)}
.cs-end-empty{color:var(--tx3);font-weight:400;font-style:italic}

.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4pt}
.tag-blue{background:var(--acc-bg);color:var(--acc)}
.tag-grey{background:var(--surf3);color:var(--tx3)}
.tag-green{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-brd)}
.tag-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-brd)}
.tag-orange{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-brd)}
.cs-status-dot{padding:1px 4px;cursor:help;margin-left:4px;font-size:9px;line-height:1}
.cs-doc-line{display:inline-flex;align-items:center}

.eye-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid transparent;border-radius:4pt;background:transparent;color:var(--tx3);cursor:pointer;transition:all .1s;padding:0}
.eye-btn:hover{background:var(--surf3);color:var(--tx)}

tr.cs-row-expired td{opacity:.5}
tr.cs-row-expired .cs-client{color:var(--tx2)}
tr.cs-row-hidden td{background:var(--surf2)}
tr.cs-row-active td:first-child{box-shadow:inset 3px 0 0 var(--grn)}
tr.cs-row-history td{background:var(--surf2);font-size:11px}
tr.cs-row-history .cs-end-cell,tr.cs-row-history .cs-date-cell{font-size:11px}

.cs-more-btn{display:inline-flex;align-items:center;height:auto;width:auto;padding:2px 6px;font-size:10px;margin-top:2px}
.cs-doc-list{line-height:1.6}

#gTooltip{position:fixed;background:var(--tx);color:#fff;padding:6px 10px;border-radius:var(--r);font-size:11px;font-weight:400;white-space:pre;z-index:9999;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);line-height:1.4}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4pt}
</style>
</head>
<body>
<div class="app">
<main class="main" id="main">

  <div class="panel">
    <div class="ph">
      <span class="ph-title">Абонентское обслуживание</span>
      <div class="ph-actions">
        <button class="btn" id="btnShowHidden" onclick="toggleShowHidden()">Показать скрытые</button>
      </div>
    </div>
    <div class="reg-filter-bar">
      <div class="reg-filter-wrap">
        <svg class="reg-filter-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="reg-filter-input" id="filterInput" placeholder="Поиск по клиенту или предмету договора…" oninput="renderTable()">
      </div>
    </div>
    <div id="tableBody"></div>
  </div>

</main>
</div>

<div class="conn-status">
  <div class="conn-dot" id="connDot"></div>
  <span class="conn-lbl" id="connLbl">Ожидание Grist…</span>
</div>
<footer class="ver-footer">v0.9.0</footer>
<div id="gTooltip"></div>

<script>
const CS_TABLE = 'Customer_subscription';
const SRC_TABLE = 'Tu_accounting';
const INV_TABLE = 'Inventory_book';
const NOTICE_TABLE = 'Notice_of_change';
const COMPONENTS_TABLE = 'Components';
const IOD_TABLE = 'Inventory_of_Documents';
// client/subject/main_doc/invoice_date/advance_date в Customer_subscription — formula-колонки
// на стороне Grist, вычисляются из tu_accounting_refs; виджет их больше не заполняет.
const LINK_COL = 'tu_accounting_refs';
const DEFAULT_OPTIONS = { hiddenKeys: {} };
const KD_LIST_LIMIT = 5;

// Grist кодирует значение колонки Ref List как ['L', id1, id2, ...]
function refListIds(v) { return Array.isArray(v) && v[0] === 'L' ? v.slice(1) : []; }
function sameIdSet(a, b) {
  const sa = a.slice().sort((x, y) => x - y), sb = b.slice().sort((x, y) => x - y);
  return sa.length === sb.length && sa.every((v, i) => v === sb[i]);
}

const S = {
  records: [],        // строки Customer_subscription (текущий вид)
  sourceRows: [],      // строки Tu_accounting
  inventory: [],        // строки Inventory_book (только чтение)
  notices: [],           // строки Notice_of_change (только чтение)
  components: [],        // строки Components (только чтение)
  iod: [],                // строки Inventory_of_Documents — описи (только чтение)
  options: { ...DEFAULT_OPTIONS },
  hiddenKeys: {},       // ключ группы (клиент+предмет договора) -> { ids: [...] } снимок id договоров на момент скрытия
  showHidden: false,
  lastGroups: new Map(), // ключ группы -> актуальная группа (для setHidden/автопоказа)
  expandedKeys: new Set(), // ключ группы -> развёрнута ли история старых договоров
};

let firstLoadDone = false;
let syncing = false;
let editingYearsId = null;
const AUTO_SYNC_INTERVAL_MS = 20000;

function gristToJsDate(v) { return (v === null || v === undefined) ? null : new Date(v * 1000); }
function fmtDate(v) {
  const d = typeof v === 'number' ? gristToJsDate(v) : v;
  if (!d) return null;
  return `${String(d.getUTCDate()).padStart(2, '0')}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${d.getUTCFullYear()}`;
}

/* ═══════════════════════════════════
   ГРУППИРОВКА Tu_accounting -> строки подписки
   ключ группы = договор отгрузки (order_text): новый договор той же
   фирмы с другой документацией всегда даёт отдельную строку.
   client/subject/main_doc/invoice_date/advance_date — formula-колонки в
   Grist, вычисляются из tu_accounting_refs на стороне документа; здесь
   собираем только ключ группы и id исходных строк для связи.
═══════════════════════════════════ */
function computeGroupsFromSource(rows) {
  const groups = new Map();
  rows.forEach(r => {
    const key = String(r.order_text || '').trim();
    if (!key) return;
    if (!groups.has(key)) groups.set(key, { key, hasClient: false, tuIds: [] });
    const g = groups.get(key);
    if (r.client_text) g.hasClient = true;
    if (r.id != null) g.tuIds.push(r.id);
  });
  return Array.from(groups.values())
    .filter(g => g.hasClient)
    .map(g => ({ shipment_contract: g.key, tuIds: g.tuIds }));
}

/* ═══════════════════════════════════
   ПЛАН СИНХРОНИЗАЦИИ (create/update) — только shipment_contract и связь
   tu_accounting_refs; service_years/service_confirmed и formula-поля
   (client/subject/main_doc/invoice_date/advance_date) автосинк не трогает.
═══════════════════════════════════ */
function computeSyncPlan() {
  const groups = computeGroupsFromSource(S.sourceRows);
  const byKey = new Map(S.records.map(r => [String(r.shipment_contract || '').trim(), r]));
  const creates = [], updates = [];
  groups.forEach(g => {
    const refs = ['L', ...g.tuIds];
    const existing = byKey.get(g.shipment_contract);
    if (!existing) {
      creates.push({ fields: { shipment_contract: g.shipment_contract, [LINK_COL]: refs } });
    } else if (!sameIdSet(refListIds(existing[LINK_COL]), g.tuIds)) {
      updates.push({ id: existing.id, fields: { [LINK_COL]: refs } });
    }
  });
  return { creates, updates };
}

// применяется автоматически при любом изменении Tu_accounting/Customer_subscription —
// без диалога подтверждения, по явному запросу пользователя
async function autoSync() {
  if (syncing || typeof grist === 'undefined') return;
  syncing = true;
  try {
    const { creates, updates } = computeSyncPlan();
    if (!creates.length && !updates.length) return;
    setConn(true, 'Синхронизация…');
    for (const c of creates) await grist.selectedTable.create({ fields: c.fields });
    for (const u of updates) await grist.selectedTable.update({ id: u.id, fields: u.fields });
    await loadRecords();
  } catch (e) {
    console.error('Ошибка автосинхронизации:', e);
  } finally {
    syncing = false;
  }
}

/* ═══════════════════════════════════
   GRIST
═══════════════════════════════════ */
function initGrist() {
  if (typeof grist === 'undefined') {
    setConn(false, 'Grist API не найден');
    renderTable();
    return;
  }
  grist.ready({ requiredAccess: 'full' });
  setConn(true, 'Загрузка…');
  grist.onOptions((options) => {
    S.options = Object.assign({}, DEFAULT_OPTIONS, options || {});
    S.hiddenKeys = normalizeHiddenKeys(S.options.hiddenKeys);
    renderTable();
  });
  // Customer_subscription — таблица виджета, об изменениях в ней Grist сообщает напрямую
  grist.onRecords(() => { if (firstLoadDone) loadRecords(); });

  Promise.all([loadRecords(), loadSource(), loadInventory(), loadNotices(), loadComponents(), loadIod()]).then(async () => {
    firstLoadDone = true;
    await autoSync();
    // Tu_accounting/Inventory_book/Notice_of_change/Components/Inventory_of_Documents —
    // сторонние таблицы, onRecords по ним не приходит, поэтому опрашиваем их периодически
    // и досинхронизируем автоматически
    setInterval(async () => {
      await Promise.all([loadSource(), loadInventory(), loadNotices(), loadComponents(), loadIod()]);
      await autoSync();
      renderTable();
    }, AUTO_SYNC_INTERVAL_MS);
  });
}

async function loadRecords() {
  if (typeof grist === 'undefined') return;
  try {
    const rows = await grist.docApi.fetchTable(CS_TABLE);
    S.records = rowsToRecords(rows);
    setConn(true, `${S.records.length} строк подписки`);
    renderTable();
  } catch (e) {
    console.error(`Ошибка загрузки ${CS_TABLE}:`, e);
    setConn(false, `Таблица ${CS_TABLE} не найдена`);
  }
}

async function loadSource() {
  if (typeof grist === 'undefined') return;
  try {
    const rows = await grist.docApi.fetchTable(SRC_TABLE);
    S.sourceRows = rowsToRecords(rows);
  } catch (e) {
    console.warn(`${SRC_TABLE} недоступна:`, e.message);
    S.sourceRows = [];
  }
}

// Inventory_book / Notice_of_change — сторонние таблицы, только чтение,
// используются для индикатора новых документов и раскрытия "КД" (требования 1 и 5)
async function loadInventory() {
  if (typeof grist === 'undefined') return;
  try {
    const rows = await grist.docApi.fetchTable(INV_TABLE);
    S.inventory = rowsToRecords(rows);
  } catch (e) {
    console.warn(`${INV_TABLE} недоступна:`, e.message);
    S.inventory = [];
  }
}

async function loadNotices() {
  if (typeof grist === 'undefined') return;
  try {
    const rows = await grist.docApi.fetchTable(NOTICE_TABLE);
    S.notices = rowsToRecords(rows);
  } catch (e) {
    console.warn(`${NOTICE_TABLE} недоступна:`, e.message);
    S.notices = [];
  }
}

// Components — справочник изделий (primary_use = цепочка «применяемость»), только чтение
async function loadComponents() {
  if (typeof grist === 'undefined') return;
  try {
    const rows = await grist.docApi.fetchTable(COMPONENTS_TABLE);
    S.components = rowsToRecords(rows);
  } catch (e) {
    console.warn(`${COMPONENTS_TABLE} недоступна:`, e.message);
    S.components = [];
  }
}

// Inventory_of_Documents — описи (опись = отправка фирме), только чтение;
// используется для расчёта "что фирма уже получила" (как в виджете описей)
async function loadIod() {
  if (typeof grist === 'undefined') return;
  try {
    const rows = await grist.docApi.fetchTable(IOD_TABLE);
    S.iod = rowsToRecords(rows);
  } catch (e) {
    console.warn(`${IOD_TABLE} недоступна:`, e.message);
    S.iod = [];
  }
}

function rowsToRecords(rows) {
  if (!rows || !rows.id) return [];
  return rows.id.map((id, i) => {
    const rec = { id };
    Object.keys(rows).forEach(k => { if (k !== 'id') rec[k] = rows[k][i]; });
    return rec;
  });
}

function setConn(ok, lbl) {
  document.getElementById('connDot').className = 'conn-dot' + (ok ? ' ok' : '');
  document.getElementById('connLbl').textContent = lbl;
}

/* ═══════════════════════════════════
   HIDE / SHOW (состояние — в опциях виджета, как в notification_numbers)
   Скрытие хранит снимок id договоров группы на момент скрытия ({ids:[...]}).
   Если у группы появляется договор с id вне снимка (новый договор клиента),
   группа автоматически возвращается — см. autoUnhideNewContracts() в renderTable.
═══════════════════════════════════ */
function normalizeHiddenKeys(raw) {
  const out = {};
  Object.keys(raw || {}).forEach(k => {
    const v = raw[k];
    if (v === true) out[k] = { ids: null }; // старый формат (до миграции) — снимок неизвестен
    else if (v && typeof v === 'object') out[k] = { ids: Array.isArray(v.ids) ? v.ids : null };
  });
  return out;
}
function isHidden(key) { return !!S.hiddenKeys[String(key)]; }
function setHidden(encodedKey, hidden) {
  const k = decodeURIComponent(encodedKey);
  if (hidden) {
    const g = S.lastGroups.get(k);
    S.hiddenKeys[k] = { ids: g ? g.contracts.map(c => c.id) : null };
  } else {
    delete S.hiddenKeys[k];
  }
  grist.setOption('hiddenKeys', S.hiddenKeys);
  renderTable();
}
// вызывается перед фильтрацией скрытых строк: если у скрытой группы появился
// договор, которого не было в снимке на момент скрытия — скрытие снимается
function autoUnhideNewContracts(groups) {
  let changed = false;
  groups.forEach(g => {
    const h = S.hiddenKeys[g.key];
    if (!h || !Array.isArray(h.ids)) return;
    const hasNew = g.contracts.some(c => !h.ids.includes(c.id));
    if (hasNew) { delete S.hiddenKeys[g.key]; changed = true; }
  });
  if (changed && typeof grist !== 'undefined') grist.setOption('hiddenKeys', S.hiddenKeys);
}
// разворот/сворачивание истории старых договоров одной подписки (группы)
function toggleExpand(encodedKey) {
  const k = decodeURIComponent(encodedKey);
  if (S.expandedKeys.has(k)) S.expandedKeys.delete(k);
  else S.expandedKeys.add(k);
  renderTable();
}

function toggleShowHidden() {
  S.showHidden = !S.showHidden;
  document.getElementById('btnShowHidden').classList.toggle('on', S.showHidden);
  document.getElementById('btnShowHidden').textContent = S.showHidden ? 'Скрыть скрытые' : 'Показать скрытые';
  renderTable();
}

/* ═══════════════════════════════════
   РЕДАКТИРОВАНИЕ: время обслуживания — окно правки (карандаш → инпут → ✓/✕),
   как в остальных наших Grist-виджетах. Сохранение и подтверждает срок:
   service_confirmed выставляется вместе со service_years за один вызов.
═══════════════════════════════════ */
function startEditYears(id) {
  editingYearsId = id;
  renderTable();
  setTimeout(() => {
    const el = document.getElementById(`yearsInput-${id}`);
    if (el) { el.focus(); el.select(); }
  }, 0);
}

function cancelEditYears() {
  editingYearsId = null;
  renderTable();
}

async function saveEditYears(id) {
  const el = document.getElementById(`yearsInput-${id}`);
  const unitEl = document.getElementById(`yearsUnit-${id}`);
  const raw = el ? el.value.trim() : '';
  const years = raw === '' ? null : Number(raw);
  if (raw !== '' && (isNaN(years) || years < 0)) { alert('Введите неотрицательное число'); return; }
  const unit = unitEl ? unitEl.value : 'years';
  try {
    await grist.selectedTable.update({
      id,
      fields: { service_years: years, service_unit: years !== null ? unit : null, service_confirmed: years !== null }
    });
    editingYearsId = null;
    renderTable();
  } catch (e) {
    console.error('Ошибка сохранения срока обслуживания:', e);
    alert('Не удалось сохранить срок: ' + e.message);
  }
}

// пресет для разовой покупки/учётной копии — заполняет поля правки, не сохраняет сам
function presetAccountingCopy(id) {
  const el = document.getElementById(`yearsInput-${id}`);
  const unitEl = document.getElementById(`yearsUnit-${id}`);
  if (el) el.value = '2';
  if (unitEl) unitEl.value = 'weeks';
}

/* ═══════════════════════════════════
   ГРУППИРОВКА ДЛЯ ОТОБРАЖЕНИЯ: повторные договоры одного клиента с тем же
   набором документов (doc_filtered) схлопываются в одну строку виджета — их
   оплаты показываются несколькими значениями в столбце «Оплата». Срок
   обслуживания/дата окончания берутся из самого свежего договора группы
   (primary), он же редактируется через окно правки.
═══════════════════════════════════ */
function groupRecordsForDisplay(rows) {
  const map = new Map();
  rows.forEach(r => {
    const key = `${r.client || ''}␟${r.doc_filtered || ''}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  });
  return Array.from(map.entries()).map(([key, contracts]) => {
    contracts.sort((a, b) => (b.advance_date || 0) - (a.advance_date || 0) ||
      (b.invoice_date || 0) - (a.invoice_date || 0) || b.id - a.id);
    return {
      key,
      client: contracts[0].client,
      group: contracts[0].group,
      doc_filtered: contracts[0].doc_filtered,
      primary: contracts[0],
      contracts
    };
  });
}

/* ═══════════════════════════════════
   ПЛАН ОТПРАВКИ ДОКУМЕНТОВ — перенесено из виджета описей
   (widget-Archive-Inventories/index.html: rootComponent, orderDocKeys,
   versionAt, firmSentVersions), адаптировано к данным этого виджета:
   "заказ" здесь — это строка Customer_subscription (toOrderLike), а не
   отдельная таблица заказов. Результат должен совпадать с планом описи
   для той же пары фирма+заказ. Сам виджет описей не меняется.
═══════════════════════════════════ */
const DECIMAL_NUMBER_RE = /[А-ЯЁA-Z]+\.\d+\.\d+/g;
function extractDns(text) {
  const out = [];
  String(text || '').replace(DECIMAL_NUMBER_RE, m => { if (out.indexOf(m) === -1) out.push(m); return m; });
  return out;
}
function normDes(s) { return String(s || '').replace(/\s+/g, '').toUpperCase(); }
function normFirm(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }
function todayEpoch() {
  const d = new Date();
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
}

// Основное изделие — верхний узел цепочки primary_use.
function rootComponent(c) {
  const seen = {};
  while (c && c.parent && !seen[c.id]) {
    seen[c.id] = true;
    const p = S.componentsById[c.parent];
    if (!p) break;
    c = p;
  }
  return c;
}

// Пересобирает служебные индексы (изделия/документы/извещения/описи/заказы)
// из уже загруженных таблиц. Вызывается в начале renderTable() — дешёво для
// объёма данных этого виджета, зато всегда актуально.
function rebuildDerived() {
  S.componentsById = {};
  S.components.forEach(r => {
    S.componentsById[r.id] = { id: r.id, name: r.name || '', dn: String(r.decimal_number || '').trim(), parent: r.primary_use || 0 };
  });
  S.componentByDn = {};
  Object.keys(S.componentsById).forEach(k => {
    const c = S.componentsById[k];
    if (!c.dn) return;
    // при дублях номера предпочитаем верхний узел (без primary_use)
    if (!S.componentByDn[c.dn] || (S.componentByDn[c.dn].parent && !c.parent)) S.componentByDn[c.dn] = c;
  });

  S.docsById = {};
  S.docsByKey = {};
  S.inventory.forEach(r => {
    const des = String(r.DocumentDesignation || '');
    const pid = r.Product || 0;
    let root = rootComponent(S.componentsById[pid]);
    if (!root) {
      const dn0 = extractDns(des)[0];
      root = dn0 && S.componentByDn[dn0] ? rootComponent(S.componentByDn[dn0]) : null;
    }
    const d = {
      id: r.id, des, key: normDes(des),
      version: r.ChangeNumber != null ? r.ChangeNumber : null,
      date: r.IssueDate != null ? r.IssueDate : null,
      root: root ? root.id : 0
    };
    S.docsById[d.id] = d;
    if (d.key) (S.docsByKey[d.key] = S.docsByKey[d.key] || []).push(d);
  });

  S.noticesByDocId = {};
  S.notices.forEach(n => {
    refListIds(n.DocumentDesignations).forEach(did => { (S.noticesByDocId[did] = S.noticesByDocId[did] || []).push(n.id); });
  });

  S.iodRaw = {};
  S.iod.forEach(r => {
    S.iodRaw[r.id] = {
      dest: normFirm(r.Destination || ''),
      date: r.IssueDate != null ? r.IssueDate : null,
      order: typeof r.Order === 'number' ? r.Order : 0,
      documents: refListIds(r.Documents)
    };
  });

  S.orderLikes = S.records.filter(r => r.shipment_contract).map(toOrderLike);
  S.orderLikesById = {};
  S.orderLikes.forEach(o => { S.orderLikesById[o.id] = o; });
}

// Строка Customer_subscription как "заказ" в терминах плана отправки.
function toOrderLike(r) {
  const docText = String(r.doc_filtered || '');
  const bought = {};
  docText.split(';').forEach(tok => { const k = normDes(tok); if (k) bought[k] = true; });
  return {
    id: r.id,
    client: normFirm(r.client),
    advance: r.advance_date != null ? r.advance_date : null,
    end: r.service_end != null ? r.service_end : null,
    dns: extractDns(docText),
    docText,
    bought,
    allKd: !!bought['КД']
  };
}

// Основные изделия заказа (по децимальным номерам из doc_filtered).
function productsForOrder(order) {
  if (!order) return [];
  const out = [];
  order.dns.forEach(dn => {
    const c = rootComponent(S.componentByDn[dn]);
    if (c && out.indexOf(c) === -1) out.push(c);
  });
  return out;
}

// Нормализованные обозначения, купленные по заказу ("КД" — все документы изделий заказа).
function orderDocKeys(order) {
  if (!order) return [];
  const roots = {};
  if (order.allKd) productsForOrder(order).forEach(c => { roots[c.id] = true; });
  return Object.keys(S.docsByKey).filter(k => {
    if (order.bought[k]) return true;
    return order.allKd && S.docsByKey[k].some(d => roots[d.root]);
  });
}

// Последняя версия документа, выпущенная не позже date (null — без ограничения).
function versionAt(key, date) {
  let best = null;
  (S.docsByKey[key] || []).forEach(d => {
    if (date != null && d.date != null && d.date > date) return;
    if (!best || (d.version || 0) > (best.version || 0) || ((d.version || 0) === (best.version || 0) && d.id > best.id)) best = d;
  });
  return best;
}

// Что фирма уже получила: {обозначение: версия} — из описей (Inventory_of_Documents)
// и из закрытых оплаченных заказов той же фирмы (повторная подписка — тот же пакет
// документов повторно не считается нужным).
function firmSentVersions(firm, order, asOf) {
  const key = normFirm(firm).toLowerCase();
  const sent = {};
  function note(k, v) { v = v || 0; if (sent[k] == null || v > sent[k]) sent[k] = v; }
  function noteOrder(o, date) {
    orderDocKeys(o).forEach(k => { const d = versionAt(k, date); if (d) note(k, d.version); });
  }
  if (!key) return { sent };
  Object.keys(S.iodRaw).forEach(rid => {
    const r = S.iodRaw[rid];
    if (r.dest.toLowerCase() !== key) return;
    if (asOf != null && r.date != null && r.date > asOf) return;
    if (r.documents.length) {
      r.documents.forEach(id => { const d = S.docsById[id]; if (d && d.key) note(d.key, d.version); });
    } else if (S.orderLikesById[r.order]) {
      noteOrder(S.orderLikesById[r.order], r.date);
    }
  });
  const limit = asOf != null ? asOf : todayEpoch();
  S.orderLikes.forEach(o => {
    if (o === order || o.client.toLowerCase() !== key || o.advance == null) return;
    const closed = o.end != null ? o.end : o.advance;
    if (closed < limit) noteOrder(o, closed);
  });
  return { sent };
}

// требование: лицензия бессрочна — никогда не считается истёкшей по service_end
function isContractExpired(rec, today) {
  if ((rec.contract_type || '') === 'лицензия') return false;
  return rec.service_end != null && rec.service_end < today;
}

// Документы заказа с подписанной подпиской-меткой для отображения:
// {label, ind:{color,tip}}. color: 'green' — актуальная версия; 'blue' —
// версия новее отправленной, изм.0 или извещение есть (нужно включить в опись);
// 'orange' — версия новее, изм.>0, извещения нет (нужно оформить извещение);
// 'red' — обозначение не найдено в Inventory_book либо изделие не найдено
// в Components.
function orderIndicators(order) {
  // orderDocKeys (как в описи) намеренно отдаёт только обозначения, реально
  // найденные в Inventory_book — купленное-но-не-найденное там просто
  // отсутствует. Здесь же нужно показать красный индикатор именно для такого
  // случая, поэтому отдельно добавляем «сырые» купленные обозначения (кроме
  // служебного «КД»), не найденные orderDocKeys.
  // при "КД" прочие токены doc_filtered — это децимальные номера ИЗДЕЛИЙ
  // (подсказка для productsForOrder), а не обозначения документов, поэтому
  // красный «не найдено» для них не нужен — только для обычной покупки.
  const boughtKeys = order.allKd ? [] : Object.keys(order.bought).filter(k => k !== 'КД');
  const keys = Array.from(new Set([...boughtKeys, ...orderDocKeys(order)]));
  if (!keys.length) return { docs: [], rowRed: true };

  // человекочитаемая подпись: из исходного текста doc_filtered (сохраняет
  // регистр/написание), а для раскрытия "КД" — из обозначения в Inventory_book
  const originalByKey = {};
  if (!order.allKd) {
    order.docText.split(';').forEach(tok => {
      const t = tok.trim();
      const k = normDes(t);
      if (k && !originalByKey[k]) originalByKey[k] = t;
    });
  }

  const asOf = todayEpoch();
  const base = firmSentVersions(order.client, order, asOf);
  const items = keys.map(key => {
    const doc = versionAt(key, asOf);
    const label = originalByKey[key] || (doc ? doc.des : key);
    let ind;
    if (!doc) {
      ind = { color: 'red', tip: `Обозначение «${label}» не найдено в инвентарной книге` };
    } else if (!doc.root) {
      ind = { color: 'red', tip: `Изделие документа «${doc.des}» не найдено в справочнике изделий` };
    } else {
      const last = doc.version || 0;
      const sent = base.sent[doc.key];
      if (sent != null && sent >= last) {
        ind = { color: 'green', tip: `У абонента последняя положенная версия (изм. ${last})` };
      } else {
        const hasNotice = (S.noticesByDocId[doc.id] || []).length > 0;
        const changeTip = sent == null ? 'новый документ' : `было изм. ${sent} → нужно изм. ${last}`;
        ind = (last > 0 && !hasNotice)
          ? { color: 'orange', tip: `${changeTip} — нужно оформить извещение` }
          : { color: 'blue', tip: `${changeTip} — нужно включить в опись` };
      }
    }
    return { label, ind };
  }).sort((a, b) => a.label.localeCompare(b.label, 'ru'));

  const rowRed = items.every(it => it.ind.color === 'red');
  return { docs: items, rowRed };
}

function statusDot(color, tip) {
  const cls = { green: 'tag-green', blue: 'tag-blue', orange: 'tag-orange', red: 'tag-red' }[color] || 'tag-grey';
  return `<span class="tag ${cls} cs-status-dot" data-tip="${esc(tip)}" onmouseenter="showTooltip(this)" onmouseleave="hideTooltip()">●</span>`;
}

function toggleKdMore(id, btn, count) {
  const el = document.getElementById(id + '-more');
  if (!el) return;
  const show = el.style.display === 'none';
  el.style.display = show ? 'block' : 'none';
  btn.textContent = show ? 'Свернуть' : `Показать полностью (+${count})`;
}

// для соседних строк (массив уже отсортирован по нужному ключу) возвращает
// по одному числу на строку: >0 — начало серии одинаковых значений и
// rowspan для её первой ячейки, -1 — строка внутри серии (ячейку не рендерим)
function computeRowSpans(items, keyFn) {
  const spans = new Array(items.length).fill(1);
  let i = 0;
  while (i < items.length) {
    let j = i + 1;
    while (j < items.length && keyFn(items[j]) === keyFn(items[i])) j++;
    spans[i] = j - i;
    for (let k = i + 1; k < j; k++) spans[k] = -1;
    i = j;
  }
  return spans;
}

/* ═══════════════════════════════════
   РЕНДЕР ТАБЛИЦЫ
═══════════════════════════════════ */
function renderTable() {
  rebuildDerived();
  const container = document.getElementById('tableBody');
  const filter = (document.getElementById('filterInput').value || '').trim().toLowerCase();
  const today = Math.floor(Date.now() / 1000);

  let rows = S.records.filter(r => r.shipment_contract);
  if (filter) {
    rows = rows.filter(r =>
      String(r.client || '').toLowerCase().includes(filter) ||
      String(r.group || '').toLowerCase().includes(filter) ||
      String(r.doc_filtered || '').toLowerCase().includes(filter));
  }

  let groups = groupRecordsForDisplay(rows);
  S.lastGroups = new Map(groups.map(g => [g.key, g]));
  autoUnhideNewContracts(groups); // требование 2: новый договор клиента снимает ручное скрытие
  groups = groups.filter(g => S.showHidden || !isHidden(g.key));

  // требование: наверху всегда фирмы с действующей подпиской — приоритет
  // считается по клиенту целиком, чтобы его строки не расклеивались при
  // объединении ячеек (rowspan) ниже
  groups.forEach(g => {
    g._expired = isContractExpired(g.primary, today);
  });
  const clientPriority = new Map();
  groups.forEach(g => {
    const pr = !g._expired ? 1 : 0;
    clientPriority.set(g.client, Math.max(clientPriority.get(g.client) || 0, pr));
  });
  groups.sort((a, b) =>
    (clientPriority.get(b.client) || 0) - (clientPriority.get(a.client) || 0) ||
    String(a.client || '').localeCompare(String(b.client || ''), 'ru') ||
    String(a.group || '').localeCompare(String(b.group || ''), 'ru') ||
    String(a.doc_filtered || '').localeCompare(String(b.doc_filtered || ''), 'ru'));

  if (!groups.length) {
    container.innerHTML = '<div class="reg-empty">Нет данных. Договоры подтягиваются автоматически из Tu_accounting.</div>';
    return;
  }

  // плоский список строк рендера: основная строка подписки + (если развёрнута)
  // старые договоры этой же подписки под ней, от нового к старому (g.contracts
  // уже отсортирован по убыванию даты аванса в groupRecordsForDisplay)
  const renderRows = [];
  groups.forEach(g => {
    renderRows.push({ kind: 'main', g });
    if (S.expandedKeys.has(g.key) && g.contracts.length > 1) {
      g.contracts.slice(1).forEach(c => renderRows.push({ kind: 'hist', g, c }));
    }
  });

  // объединение соседних строк с одинаковым клиентом/изделием в одну ячейку
  // (rowspan) — считается уже по плоскому списку, чтобы строки истории тоже
  // попадали в объединённую ячейку своей подписки
  const clientSpans = computeRowSpans(renderRows, r => String(r.g.client || ''));
  const groupSpans = computeRowSpans(renderRows, r => `${r.g.client || ''}␟${r.g.group || ''}`);

  const body = renderRows.map((row, i) => {
    const g = row.g;
    const clientCell = clientSpans[i] > 0
      ? `<td${clientSpans[i] > 1 ? ` rowspan="${clientSpans[i]}"` : ''}><div class="cs-client">${esc(g.client || '—')}</div></td>`
      : '';
    const groupCell = groupSpans[i] > 0
      ? `<td class="cs-group"${groupSpans[i] > 1 ? ` rowspan="${groupSpans[i]}"` : ''}>${esc(g.group || '—')}</td>`
      : '';
    const clientStartClass = clientSpans[i] > 0 && i > 0 ? 'cs-client-start' : '';

    if (row.kind === 'hist') {
      const c = row.c;
      const expiredH = isContractExpired(c, today);
      const endStrH = fmtDate(c.service_end);
      const unitLabelH = c.service_unit === 'weeks' ? 'нед.' : 'г.';
      const dateStrH = fmtDate(c.advance_date) || 'не указано';
      const emptyClsH = c.advance_date == null ? ' cs-date-empty' : '';
      const tipH = `Договор отгрузки: ${c.shipment_contract || '—'}\nДата счета: ${fmtDate(c.invoice_date) || '—'}\nГлавный документ: ${c.main_doc || '—'}`;
      return `
      <tr class="cs-row-history ${clientStartClass}">
        ${clientCell}
        ${groupCell}
        <td class="cs-doc cs-doc-history">↳ ${esc(c.shipment_contract || '—')}</td>
        <td><span class="cs-date-cell${emptyClsH}" data-tip="${esc(tipH)}" onmouseenter="showTooltip(this)" onmouseleave="hideTooltip()">${esc(dateStrH)}</span></td>
        <td>${c.service_years != null ? esc(String(c.service_years)) + ' ' + unitLabelH : '<span class="cs-date-empty">не задано</span>'}</td>
        <td>
          ${endStrH
            ? `<span class="cs-end-cell">${endStrH}</span> ${expiredH ? '<span class="tag tag-red">истёк</span>' : '<span class="tag tag-green">действует</span>'}`
            : '<span class="cs-end-cell cs-end-empty">—</span>'}
        </td>
        <td></td>
      </tr>`;
    }

    const hidden = isHidden(g.key);
    const p = g.primary;
    const expired = g._expired;
    const endDateStr = fmtDate(p.service_end);
    const rowClasses = ['', expired ? 'cs-row-expired' : 'cs-row-active', hidden ? 'cs-row-hidden' : '', clientStartClass]
      .filter(Boolean).join(' ');

    // требование 5: "КД" и обычный список документов раскрываются одинаково —
    // через orderDocKeys (купленные документы +, если "КД", все документы
    // основных изделий заказа). требование 3: у каждого документа — цветной
    // индикатор того, что с ним нужно сделать; если ВЕСЬ заказ не удалось
    // связать со справочниками — значок на уровне строки. требование 4: для
    // истёкшей подписки индикаторов нет вообще.
    let docCellHtml, rowBadge = '';
    const docText = String(g.doc_filtered || '').trim();
    if (expired || !docText) {
      docCellHtml = esc(g.doc_filtered || '—');
    } else {
      const plan = orderIndicators(toOrderLike(p));
      if (plan.rowRed) {
        docCellHtml = esc(g.doc_filtered || '—');
        rowBadge = statusDot('red', 'Не удалось связать документы заказа со справочниками (инвентарная книга / изделия)');
      } else {
        const lines = plan.docs.map(it => `<span class="cs-doc-line">${esc(it.label)}${statusDot(it.ind.color, it.ind.tip)}</span>`);
        const shown = lines.slice(0, KD_LIST_LIMIT);
        const rest = lines.slice(KD_LIST_LIMIT);
        const domId = 'kd-' + encodeURIComponent(g.key).replace(/[^a-zA-Z0-9]/g, '');
        docCellHtml = `<div class="cs-doc-list">${shown.join('<br>')}</div>` +
          (rest.length
            ? `<div class="cs-doc-list" id="${domId}-more" style="display:none">${rest.join('<br>')}</div>
               <button class="cell-edit-btn cs-more-btn" onclick="toggleKdMore('${domId}', this, ${rest.length})">Показать полностью (+${rest.length})</button>`
            : '');
      }
    }

    // столбец «Оплата» основной строки — платёж актуального (primary) договора;
    // остальные (старые) договоры группы доступны по развороту строки (кнопка
    // в ячейке «Документ»), там они — отдельные строки истории
    const tip = `Договор отгрузки: ${p.shipment_contract || '—'}\nДата счета: ${fmtDate(p.invoice_date) || '—'}\nГлавный документ: ${p.main_doc || '—'}`;
    const dateStr = fmtDate(p.advance_date) || 'не указано';
    const emptyCls = p.advance_date == null ? ' cs-date-empty' : '';
    const payments = `<span class="cs-date-cell${emptyCls}" data-tip="${esc(tip)}" onmouseenter="showTooltip(this)" onmouseleave="hideTooltip()">${esc(dateStr)}</span>`;

    const expandBtn = g.contracts.length > 1
      ? `<button class="cell-edit-btn cs-expand-btn" onclick="toggleExpand('${encodeURIComponent(g.key)}')" title="${S.expandedKeys.has(g.key) ? 'Свернуть историю' : `Показать старые подписки (${g.contracts.length - 1})`}">${chevronSvg(S.expandedKeys.has(g.key))}</button>`
      : '';

    const unitLabel = p.service_unit === 'weeks' ? 'нед.' : 'г.';
    const yearsCell = editingYearsId === p.id ? `
        <div class="cell-edit-wrap-inline">
          <input class="cell-edit-input mono" id="yearsInput-${p.id}" type="number" min="0" step="0.5"
                 value="${p.service_years != null ? esc(String(p.service_years)) : ''}" placeholder="срок" autocomplete="off"
                 onkeydown="if(event.key==='Enter')saveEditYears(${p.id});if(event.key==='Escape')cancelEditYears();">
          <select class="cell-edit-unit" id="yearsUnit-${p.id}">
            <option value="years" ${p.service_unit !== 'weeks' ? 'selected' : ''}>лет</option>
            <option value="weeks" ${p.service_unit === 'weeks' ? 'selected' : ''}>нед.</option>
          </select>
          <button class="cell-edit-btn save" onclick="saveEditYears(${p.id})" title="Сохранить">${checkSvg()}</button>
          <button class="cell-edit-btn cancel" onclick="cancelEditYears()" title="Отмена">${xSvg()}</button>
          <button class="cell-edit-btn cell-edit-btn-wide" onclick="presetAccountingCopy(${p.id})" title="Учётная копия (разовая покупка) — 2 недели">2 нед.</button>
        </div>`
      : `
        <div class="cs-years-view">
          <span>${p.service_years != null ? esc(String(p.service_years)) + ' ' + unitLabel : '<span class="cs-date-empty">не задано</span>'}</span>
          <button class="cell-edit-btn" onclick="startEditYears(${p.id})" title="Изменить срок">${pencilSvg()}</button>
        </div>`;

    return `
    <tr class="${rowClasses}">
      ${clientCell}
      ${groupCell}
      <td class="cs-doc">${expandBtn}${docCellHtml}${rowBadge ? ' ' + rowBadge : ''}${hidden ? ' <span class="tag tag-grey">скрыто</span>' : ''}</td>
      <td><div class="cs-payments">${payments}</div></td>
      <td>${yearsCell}</td>
      <td>
        ${endDateStr
          ? `<span class="cs-end-cell">${endDateStr}</span> ${expired ? '<span class="tag tag-red">истёк</span>' : '<span class="tag tag-green">действует</span>'}`
          : '<span class="cs-end-cell cs-end-empty">—</span>'}
      </td>
      <td style="text-align:center">
        <button class="eye-btn" title="${hidden ? 'Показать' : 'Скрыть'}" onclick="setHidden('${encodeURIComponent(g.key)}', ${!hidden})">
          ${hidden
            ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
            : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'}
        </button>
      </td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <table class="reg-table">
      <thead><tr>
        <th style="width:16%">Клиент</th>
        <th style="width:12%">Группа</th>
        <th style="width:24%">Документ</th>
        <th style="width:14%">Оплата</th>
        <th style="width:14%">Время обслуживания</th>
        <th style="width:14%">Окончание обслуживания</th>
        <th style="width:6%"></th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

/* ═══════════════════════════════════
   ПОДСКАЗКИ / УТИЛИТЫ
═══════════════════════════════════ */
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function pencilSvg() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>'; }
function checkSvg() { return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>'; }
function xSvg() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }
function chevronSvg(open) {
  return open
    ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>'
    : '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>';
}

function showTooltip(el) {
  const t = document.getElementById('gTooltip');
  const text = el.getAttribute('data-tip') || '';
  if (!text) return;
  t.textContent = text;
  t.style.display = 'block';
  const r = el.getBoundingClientRect();
  const tw = t.offsetWidth, th = t.offsetHeight;
  let top = r.top - th - 8, left = r.left + r.width / 2 - tw / 2;
  left = Math.max(4, Math.min(left, window.innerWidth - tw - 4));
  if (top < 4) top = r.bottom + 8;
  t.style.top = top + 'px';
  t.style.left = left + 'px';
}
function hideTooltip() { document.getElementById('gTooltip').style.display = 'none'; }

/* ═══════════════════════════════════
   BOOT
═══════════════════════════════════ */
renderTable();
initGrist();
</script>
